[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-pipeline"
version = "0.1.0"
description = "YouTube Shorts automation pipeline (V1)"
requires-python = ">=3.11"
dependencies = [
    "tzdata",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "aiofiles>=24.1",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
align = ["faster-whisper>=1.0"]
tts = [
    "kokoro>=0.9.2",
    "soundfile>=0.12",
    "numpy>=1.26",
]
gemini = ["google-genai>=1.0"]
telegram = ["telethon>=1.36", "watchdog>=4.0"]
prod = [
    "faster-whisper>=1.0",
    "kokoro>=0.9.2",
    "soundfile>=0.12",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
shorts-server = "shorts_pipeline.cli.server:main"
shorts-run-one = "shorts_pipeline.cli.run_one:main"
shorts-health = "shorts_pipeline.cli.health:main"
shorts-smoke = "shorts_pipeline.cli.smoke:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs live local services such as vLLM, ComfyUI, Kokoro, or FFmpeg media fixtures",
    "gpu: needs GPU-backed services",
]
addopts = "-m 'not integration and not gpu'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["shorts_pipeline"]
